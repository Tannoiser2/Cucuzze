name: Cucuzze checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server.js
      - run: node --check public/app.js
      - run: node --check docs/game.js
      - run: node --test test/*.test.js
