<style>
@font-face{font-family:Chewy;src:url(fonts/chewy.woff2)}@font-face{font-family:Nunito;src:url(fonts/nunito-700.woff2)}:root{--paper:#fff0c8;--wood:#4d2e18;--orange:#dc7621;--green:#4f742f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#28170d url(assets/bg-sala.webp) center/cover fixed;color:#382313;font:700 17px Nunito,system-ui}button,input,select{font:inherit}.screen{min-height:100vh;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;color:#fff;text-shadow:0 2px 5px #000}.logo{font:46px Chewy;color:#f4a13c}.badge,.panel{background:var(--paper);border:3px solid var(--wood);border-radius:16px;box-shadow:0 6px 18px #0008}.panel{padding:18px}.landing{max-width:900px;margin:4vh auto;display:grid;grid-template-columns:1fr 1fr;gap:18px}.landing h1{font:58px Chewy;margin:.1em 0;color:#e67d25}.big{width:100%;padding:16px;border:3px solid var(--wood);border-radius:13px;background:var(--orange);color:#fff;font-weight:900;box-shadow:0 4px var(--wood)}.secondary{background:var(--green)}input,select{width:100%;padding:13px;border:3px solid var(--wood);border-radius:12px;background:#fff;margin:6px 0 14px}.lobby{max-width:1050px;margin:2vh auto;text-align:center}.lobby-grid{display:grid;grid-template-columns:290px 1fr;gap:20px;align-items:center}.qr{background:#fff;display:inline-block;padding:10px;border-radius:14px}.players{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.chip{padding:10px 15px;background:#fff;border:2px solid var(--wood);border-radius:99px}.tv-board{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:10px}.tv-field{position:relative;aspect-ratio:1.45;overflow:hidden;border:4px solid var(--wood);border-radius:15px;background:url(assets/campo-cucuzze.png) center/cover;box-shadow:0 5px 14px #0009}.tv-field.ready{border-color:#7bc043}.tv-field .who{position:absolute;z-index:8;left:7px;top:6px;padding:3px 9px;border-radius:99px;background:#fff0cddd;font:23px Chewy}.tv-field .safe{position: </style><style>
.scene-caption{position:fixed;z-index:30;left:50%;bottom:3vh;transform:translateX(-50%);min-width:min(720px,90vw);padding:12px 25px;border:4px solid var(--wood);border-radius:18px;background:#fff0c9f2;text-align:center;box-shadow:0 8px 30px #000a}.scene-caption b{display:block;font:38px Chewy}.scene-caption small{font-size:18px}.tv-field.hit{animation:fieldShake .55s ease 2}.pumpkin.fresh{animation:pumpkinGrow .75s cubic-bezier(.2,1.8,.4,1) both}.field-fx{position:absolute;z-index:12;inset:0;pointer-events:none;display:grid;place-items:center;font-size:44px;text-shadow:0 3px 3px #0008}.fx-sow{animation:sowBurst 1.7s ease both}.fx-crows{animation:crowDive 2s ease-in-out both}.fx-raccoons{animation:raccoonRaid 2s ease-in-out both}.fx-market{animation:marketRise 2s ease-in both}.final-report{min-height:100vh;padding:18px;background:#29180dcc url(assets/bg-sala.webp) center/cover fixed}.final-title{text-align:center;color:#fff;text-shadow:0 3px 6px #000}.final-title h1{font:64px Chewy;color:#f3a13e;margin:0}.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:1050px;margin:15px auto}.podium-card{padding:18px;text-align:center;background:var(--paper);border:5px solid var(--wood);border-radius:18px;box-shadow:0 8px 20px #0009}.podium-card.first{transform:translateY(-10px);border-color:#e0a51b}.podium-card .medal{font-size:52px}.podium-card h2{font:34px Chewy;margin:4px}.money{font:32px Chewy;color:#8f3c18}.final-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:15px;max-width:1200px;margin:auto}.ranking,.awards{padding:15px;background:#fff0c9ec;border:4px solid var(--wood);border-radius:18px}.rank-row{display:grid;grid-template-columns:42px 1fr auto;align-items:center;padding:7px;border-bottom:1px dashed #9a7655}.rank-row .place{font:28px Chewy}.award{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;padding:10px;margin:7px 0;background:#fff8;border-radius:13px}.award>span{font-size:38px}@keyframes pumpkinGrow{0%{transform:translate(-50%,-50%) scale(0) rotate(-25deg)}70%{transform:translate(-50%,-50%) scale(1.25) rotate(8deg)}100%{transform:translate(-50%,-50%) scale(1)}}@keyframes sowBurst{0%{opacity:0;transform:translateY(-35px) scale(.4)}35%,75%{opacity:1;transform:translateY(0) scale(1.25)}100%{opacity:0;transform:scale(.9)}}@keyframes crowDive{0%{opacity:0;transform:translate(45%,-65%) scale(.5)}40%{opacity:1;transform:translate(0,0) scale(1.4)}75%{transform:translate(-12%,12%) scale(1.1)}100%{opacity:0;transform:translate(-55%,45%) scale(.7)}}@keyframes raccoonRaid{0%{opacity:0;transform:translateX(-65%) scale(.5)}35%{opacity:1;transform:translateX(0) scale(1.3)}70%{transform:translateX(12%) scale(1.15)}100%{opacity:0;transform:translateX(70%) scale(.65)}}@keyframes marketRise{0%{opacity:0;transform:translateY(35%) scale(.5)}35%{opacity:1;transform:translateY(0) scale(1.3)}100%{opacity:0;transform:translateY(-55%) scale(.8)}}@keyframes fieldShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px) rotate(-.6deg)}75%{transform:translateX(5px) rotate(.6deg)}}@media(max-width:900px){.scene-caption b{font-size:29px}.podium{grid-template-columns:1fr}.podium-card.first{transform:none}.final-grid{grid-template-columns:1fr}}
</style><style>
.phase-banner{display:flex;flex-direction:column;align-items:center;min-width:340px;padding:7px 18px;background:#fff0c8;border:3px solid #4d2e18;border-radius:15px;color:#382313;text-shadow:none}.phase-banner b{font:28px Chewy}.phase-banner small{max-width:520px;text-align:center}.phase-phone{padding:15px;background:#fff0c8;border:4px solid #4d2e18;border-radius:18px;text-align:center}.phase-number{display:inline-block;padding:5px 12px;border-radius:99px;background:#4f742f;color:#fff}.phase-phone h1{font:38px Chewy;margin:4px}.event-card{padding:16px;margin:12px 0;background:#341f15;color:#fff0c8;border:4px solid #dc7621;border-radius:16px}.event-card>span{font-size:54px}.event-card h2{font:34px Chewy;color:#f4a13c;margin:4px}.choice-help{padding:10px;background:#fff8;border-radius:12px}.pass{width:100%;margin:14px 0;padding:12px;border:3px solid #4d2e18;border-radius:12px;background:#8b765d;color:#fff}.phase-phone .dice-row{margin:12px 0}.phase-phone .die{min-height:70px}@media(max-width:900px){.phase-banner{position:fixed;z-index:20;top:6px;left:50%;transform:translateX(-50%);min-width:min(430px,74vw)}.phase-banner small{display:none}}
</style><style>
.tv-board{position:relative}.tv-field.launching{animation:launchPulse 1s ease 2;border-color:#f5a43f}.story-flight{position:absolute;z-index:25;left:0;top:0;width:100%;height:100%;pointer-events:none}.story-flight>i{position:absolute;left:var(--sx);top:var(--sy);font-style:normal;font-size:42px;filter:drop-shadow(0 5px 4px #0008);animation:storyTravel 2.7s cubic-bezier(.35,.05,.55,1) both}.story-flight .flying-loot{position:absolute;left:var(--tx);top:var(--ty);font-style:normal;font-size:26px;animation:lootReturn 3.4s ease-in-out .2s both}.scene-caption{min-height:92px}.scene-caption small{display:block;margin-top:4px}.tv-field.hit .pumpkin{animation:pumpkinPanic .65s ease-in-out 2}@keyframes storyTravel{0%{opacity:0;transform:translate(-50%,-50%) scale(.25)}15%{opacity:1;transform:translate(-50%,-75%) scale(1.15)}72%{opacity:1;transform:translate(calc(var(--tx) - var(--sx) - 50%),calc(var(--ty) - var(--sy) - 50%)) scale(1.35)}100%{opacity:0;transform:translate(calc(var(--tx) - var(--sx) - 50%),calc(var(--ty) - var(--sy) - 25%)) scale(.8)}}@keyframes lootReturn{0%,58%{opacity:0;transform:translate(-50%,-50%) scale(.4)}65%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(calc(var(--sx) - var(--tx) - 50%),calc(var(--sy) - var(--ty) - 50%)) scale(.8)}}@keyframes launchPulse{50%{transform:scale(1.025);box-shadow:0 0 25px #f5a43f}}@keyframes pumpkinPanic{25%{transform:translate(-58%,-55%) rotate(-12deg)}75%{transform:translate(-42%,-45%) rotate(12deg)}}
</style></head><body><style>
.story-stage{position:absolute;z-index:28;inset:0;pointer-events:none;overflow:visible}.story-stage i{position:absolute;font-style:normal;filter:drop-shadow(0 4px 3px #0008)}.raccoon-scene .animal-out,.crow-scene .animal-out{left:var(--sx);top:var(--sy);font-size:40px;animation:goToField 1.25s ease-in-out both}.raccoon-scene .searching{left:var(--tx);top:var(--ty);font-size:38px;animation:searchPumpkins .7s ease 1.15s both}.story-stage .defense-hit{left:var(--tx);top:var(--ty);font-size:48px;animation:defenseClash .8s ease 1.3s both}.raccoon-scene .pickup{left:var(--tx);top:var(--ty);font-size:28px;animation:pickUp .75s ease 1.75s both}.raccoon-scene .animal-back{left:var(--tx);top:var(--ty);font-size:38px;white-space:nowrap;animation:returnHome 1.35s ease-in-out 2.35s both}.crow-scene .pumpkin-burst{left:var(--tx);top:var(--ty);font-size:35px;animation:burstPumpkins 1.5s ease 1.35s both}.story-stage .no-loot{left:var(--tx);top:var(--ty);font-size:58px;animation:defenseClash 1.2s ease 1.4s both}.sow-scene .seed-rain{left:18%;right:18%;top:-10%;font-size:34px;word-spacing:80px;animation:seedFall 2s ease both}.sow-scene .sun-flash{left:50%;top:30%;font-size:80px;animation:sunGrow 2.3s ease both}.market-scene i:first-child{left:-8%;top:45%;font-size:65px;animation:cartAcross 2.6s linear both}.market-scene i:last-child{left:50%;top:45%;font-size:45px;animation:marketPop 2.4s ease both}@keyframes goToField{0%{left:var(--sx);top:var(--sy);opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1}75%,100%{left:var(--tx);top:var(--ty);opacity:1;transform:translate(-50%,-65%) scale(1.2)}}@keyframes searchPumpkins{0%{opacity:0;transform:translate(-50%,-30%) scale(.3)}45%,75%{opacity:1;transform:translate(-50%,-85%) scale(1.35)}100%{opacity:0}}@keyframes pickUp{0%{opacity:0;transform:translate(-50%,0) scale(1.4)}45%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-90%) scale(.5)}}@keyframes returnHome{0%{opacity:0;left:var(--tx);top:var(--ty);transform:translate(-50%,-50%) scale(.7)}12%{opacity:1}85%{opacity:1}100%{opacity:0;left:var(--sx);top:var(--sy);transform:translate(-50%,-50%) scale(1.1)}}@keyframes defenseClash{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}35%,70%{opacity:1;transform:translate(-50%,-50%) scale(1.35) rotate(-8deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(.7)}}@keyframes burstPumpkins{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.4)}100%{opacity:0;transform:translate(-50%,-160%) rotate(25deg) scale(.7)}}@keyframes seedFall{0%{opacity:0;transform:translateY(-50px)}25%{opacity:1}100%{opacity:0;transform:translateY(230px) rotate(40deg)}}@keyframes sunGrow{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}40%,70%{opacity:.85;transform:translate(-50%,-50%) scale(1.25)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}@keyframes cartAcross{0%{left:-8%;opacity:0}12%{opacity:1}88%{opacity:1}100%{left:95%;opacity:0}}@keyframes marketPop{0%,25%{opacity:0;transform:translate(-50%,-50%) scale(.4)}55%{opacity:1;transform:translate(-50%,-50%) scale(1.35)}100%{opacity:0;transform:translate(-50%,-120%) scale(.8)}}
</style><style>
.story-header{min-width:min(600px,58vw);max-width:min(700px,62vw);padding:5px 12px}.story-header b{font-size:24px;line-height:1.05}.story-header small{font-size:14px;line-height:1.1}.harvest-stack{position:absolute;z-index:7;right:7%;bottom:8%;padding:3px 7px;border:2px solid #4d2e18;border-radius:10px;background:#fff0cddd;font-style:normal;font:20px Chewy;color:#8f3c18}.auction-steps{display:grid;gap:5px;margin:10px 0;padding:10px;text-align:left;background:#fff8;border-radius:12px}.auction-steps b{color:#8f3c18}.auction-steps small{display:block;margin-bottom:5px}.phase-phone #confirm:disabled{background:#9b8c78;color:#eee}.phase-phone .target.selected:after{content:' ✓ PILOTA QUI';display:block;margin-top:4px;color:#8f251d;font-weight:900}@media(max-width:900px){.phase-banner{position:static;transform:none;min-width:0;max-width:58vw}.story-header b{font-size:19px}.story-header small{display:block;font-size:11px}.logo{font-size:34px}.top{gap:6px}.harvest-stack{font-size:16px}}
