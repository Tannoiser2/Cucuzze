<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cucuzze 2.0 — TV e telefoni</title>
<link rel="preload" href="fonts/chewy.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Chewy;src:url(fonts/chewy.woff2)}@font-face{font-family:Nunito;src:url(fonts/nunito-700.woff2)}:root{--paper:#fff0c8;--wood:#4d2e18;--orange:#dc7621;--green:#4f742f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#28170d url(assets/bg-sala.webp) center/cover fixed;color:#382313;font:700 17px Nunito,system-ui}button,input,select{font:inherit}.screen{min-height:100vh;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;color:#fff;text-shadow:0 2px 5px #000}.logo{font:46px Chewy;color:#f4a13c}.badge,.panel{background:var(--paper);border:3px solid var(--wood);border-radius:16px;box-shadow:0 6px 18px #0008}.panel{padding:18px}.landing{max-width:900px;margin:4vh auto;display:grid;grid-template-columns:1fr 1fr;gap:18px}.landing h1{font:58px Chewy;margin:.1em 0;color:#e67d25}.big{width:100%;padding:16px;border:3px solid var(--wood);border-radius:13px;background:var(--orange);color:#fff;font-weight:900;box-shadow:0 4px var(--wood)}.secondary{background:var(--green)}input,select{width:100%;padding:13px;border:3px solid var(--wood);border-radius:12px;background:#fff;margin:6px 0 14px}.lobby{max-width:1050px;margin:2vh auto;text-align:center}.lobby-grid{display:grid;grid-template-columns:290px 1fr;gap:20px;align-items:center}.qr{background:#fff;display:inline-block;padding:10px;border-radius:14px}.players{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.chip{padding:10px 15px;background:#fff;border:2px solid var(--wood);border-radius:99px}.tv-board{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:10px}.tv-field{position:relative;aspect-ratio:1.45;overflow:hidden;border:4px solid var(--wood);border-radius:15px;background:url(assets/campo-cucuzze.png) center/cover;box-shadow:0 5px 14px #0009}.tv-field.ready{border-color:#7bc043}.tv-field .who{position:absolute;z-index:8;left:7px;top:6px;padding:3px 9px;border-radius:99px;background:#fff0cddd;font:23px Chewy}.tv-field .safe{position:absolute;z-index:8;right:7px;top:6px;padding:4px 8px;border-radius:99px;background:#3b2218d9;color:#fff}.pumpkin{position:absolute;z-index:3;width:9%;aspect-ratio:1;transform:translate(-50%,-50%);background:url(assets/zucca.webp) center/contain no-repeat;filter:drop-shadow(0 2px 1px #3218)}.fence{position:absolute;z-index:5;bottom:3%;left:16%;right:16%;height:7%;border-top:5px solid #70401e;border-bottom:5px solid #70401e}.scare{position:absolute;z-index:5;right:11%;bottom:19%;font-size:32px}.tv-message{position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);padding:20px 36px;background:#fff0c9ee;border:5px solid var(--wood);border-radius:20px;font:42px Chewy;text-align:center;box-shadow:0 10px 40px #000b}.tv-foot{display:flex;justify-content:center;gap:12px;margin-top:10px}.phone{max-width:520px;margin:auto;padding:12px}.phone .logo{font-size:38px;text-align:center}.action{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;margin:10px 0;padding:12px;border:3px solid var(--wood);border-radius:15px;background:#fff9}.action-icon{font-size:48px;text-align:center}.dice-row{display:flex;gap:8px}.die{flex:1;padding:12px 5px;border:4px solid var(--wood);border-radius:13px;background:#fff;font-size:30px;font-weight:900}.die.selected{background:#f5a43f;color:#fff}.targets{display:grid;grid-template-columns:1fr 1fr;gap:8px}.target{padding:10px;border:3px solid #94704e;border-radius:12px;background:#fff}.target.selected{border-color:#bd3d26;background:#ffe0bd}.ready-note{text-align:center;font-size:23px}.offline{background:#a52d22;color:#fff;padding:10px;text-align:center}.hint{text-align:center;opacity:.75}.hidden{display:none}@media(max-width:1100px) and (min-width:901px){.tv-board{grid-template-columns:repeat(4,1fr)}}@media(max-width:900px){.landing{grid-template-columns:1fr}.tv-board{grid-template-columns:repeat(2,1fr)}.lobby-grid{grid-template-columns:1fr}.screen{padding:8px}}@media(min-width:1200px){.tv-field .who{font-size:28px}}
</style></head><body><main id="app"></main>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="v2-engine.js?v=6"></script><script src="v2-multi.js?v=1"></script>
</body></html>
