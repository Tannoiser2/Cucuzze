<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cucuzze 2.0 - Prova reale</title><link rel="preload" href="fonts/chewy.woff2" as="font" type="font/woff2" crossorigin><style>
@font-face{font-family:Chewy;src:url(fonts/chewy.woff2)}@font-face{font-family:Nunito;src:url(fonts/nunito-700.woff2)}:root{--wood:#5a3a20;--paper:#fff1ca;--orange:#db741e;--green:#48702c;--red:#9d3524}*{box-sizing:border-box}body{margin:0;background:#26190f url(assets/bg-alba.webp) center/cover fixed;color:#392514;font:700 16px Nunito,system-ui}.wrap{max-width:1180px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:white;text-shadow:0 2px 5px #000}.top h1{font:46px Chewy;margin:0;color:#f49a37}.panel,.field,.garden-panel{background:var(--paper);border:3px solid var(--wood);border-radius:16px;box-shadow:0 6px 18px #0008;padding:14px}.status{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}.stat{background:#fff8;border-radius:11px;padding:9px;text-align:center}.stat b{display:block;font-size:22px}.garden-panel{margin-bottom:12px;padding:10px}.garden-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px 7px}.garden-head h2{font:30px Chewy;margin:0}.garden-stage{position:relative;overflow:hidden;aspect-ratio:3/2;border:3px solid #6d431e;border-radius:12px;background:#b86b24 url(assets/campo-cucuzze.png) center/cover no-repeat}.garden-stage canvas{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 5px 3px #2b160a99)}.garden-note{position:absolute;right:10px;bottom:10px;padding:6px 10px;border-radius:99px;background:#2b170bbd;color:#fff;font-size:13px;pointer-events:none}.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.field{cursor:pointer;transition:.15s transform,.15s outline}.field:hover{transform:translateY(-2px)}.field.me{outline:5px solid #f4c74e}.field.viewing{outline:5px solid #e47d24}.name{font:25px Chewy;display:flex;justify-content:space-between}.numbers{display:flex;gap:6px;flex-wrap:wrap}.pill{background:#fff8;border:2px solid #6b4a2a55;border-radius:99px;padding:3px 8px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.dice{display:flex;gap:10px;justify-content:center;margin:8px}.die{width:58px;height:58px;display:grid;place-items:center;background:white;border:4px solid var(--wood);border-radius:13px;font-size:30px}label{display:block;margin:8px 0 3px}select,input{width:100%;padding:9px;border:2px solid var(--wood);border-radius:9px;background:white;font:inherit}button{border:3px solid #3e2815;border-radius:11px;padding:10px 15px;background:var(--orange);color:white;font:900 16px Nunito;cursor:pointer;box-shadow:0 3px #3e2815}button.green{background:var(--green)}button:disabled{opacity:.5}.result{margin-top:12px}.line{padding:7px;border-bottom:1px dashed #8e744e}.final{font:34px Chewy;color:var(--red)}.hint{opacity:.75;font-size:13px}.warning{color:var(--red)}@media(max-width:760px){.controls{grid-template-columns:1fr}.status{grid-template-columns:repeat(2,1fr)}.top h1{font-size:34px}.garden-head{align-items:flex-start;flex-direction:column}.garden-stage{aspect-ratio:4/3}}</style></head><body><main class="wrap"><header class="top"><div><h1>Cucuzze 2.0</h1><div>Prova reale del nuovo motore</div></div><button id="new">Nuova partita</button></header><section class="status" id="status"></section><section class="garden-panel"><div class="garden-head"><h2 id="gardenTitle">Il tuo campo</h2><span id="gardenCount">0 zucche</span></div><div class="garden-stage" id="gardenStage"><div class="garden-note">1 zucca = 1 casella</div></div></section><section class="board" id="board"></section><section class="controls"><div class="panel"><h2>Le tue scelte</h2><div class="dice" id="dice"></div><div id="orders"></div><button class="green" id="resolve">Conferma e risolvi il turno</button><p class="hint">Ogni dado deve essere usato una volta: Semina, Difendi, Attacca.</p></div><div class="panel"><h2>Cronaca</h2><div id="result"></div></div></section></main><script src="v2-engine.js?v=5"></script><script>
const E=CucuzzeV2,$=s=>document.querySelector(s);let g,rng=Math.random,viewedPlayerId='p0';
const animal=x=>x==='crows'?'Corvi':'Procioni',defense=x=>x==='fence'?'Recinto':x==='scarecrow'?'Spaventapasseri':'Contadino con la Lupara';
const money=n=>(n*.5).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const segments=n=>'■'.repeat(n)+'□'.repeat(6-n);
function start(){g=E.newGame(8,rng);viewedPlayerId=g.players[0].id;E.roll(g,rng);draw()}
function options(vals,selected){return vals.map(v=>`<option value="${v}" ${v==selected?'selected':''}>${v}</option>`).join('')}
function draw(){const me=g.players[0],rank=E.standings(g),marketIn=g.marketAt-g.turnInCycle+1;$('#status').innerHTML=`<div class="stat"><span>Cucuzzaro</span><b>${g.fund} 🎃</b><small>${money(g.fund)}</small></div><div class="stat"><span>Ciclo</span><b>${g.final?'FINALE':g.cycle}</b></div><div class="stat"><span>Turno ciclo</span><b>${g.turnInCycle}</b></div><div class="stat"><span>Mercato fra</span><b>${marketIn} ${marketIn===1?'turno':'turni'}</b></div><div class="stat"><span>Giocati</span><b>${g.turn}</b></div>`;
 const viewed=g.players.find(p=>p.id===viewedPlayerId)||g.players[0],incoming=(g.last?.detail||[]).filter(x=>x.target===viewed.id),lastStats=g.last?.turnStats?.[viewed.id];$('#gardenTitle').textContent=`Campo di ${viewed.name}`;$('#gardenCount').textContent=`${viewed.field} ${viewed.field===1?'zucca':'zucche'}`;window.showPumpkinField?.(viewed.field,{fence:viewed.fence,scarecrow:viewed.scarecrow,farmer:viewed.field>0,shotgun:lastStats?.built==='shotgun',crows:incoming.filter(x=>x.type==='crows').reduce((n,x)=>n+x.list.length,0),raccoons:incoming.filter(x=>x.type==='raccoons').reduce((n,x)=>n+x.list.length,0),boars:0});
 $('#board').innerHTML=rank.map((p,i)=>`<article class="field ${p.human?'me':''} ${p.id===viewed.id?'viewing':''}" data-player="${p.id}" title="Guarda questo campo"><div class="name"><span>${p.name}</span><small>#${i+1}</small></div><div class="numbers"><span class="pill">Campo ${p.field} 🎃</span><span class="pill">Tasca ${money(p.pocket)}</span></div><div class="hint">Recinto <b>${segments(p.fence)}</b></div><div class="hint">Spaventapasseri <b>${segments(p.scarecrow)}</b></div><small>${p.human?'Sei tu':p.style}</small></article>`).join('');
 document.querySelectorAll('[data-player]').forEach(card=>card.onclick=()=>{viewedPlayerId=card.dataset.player;draw()});
 if(g.finished){$('#dice').innerHTML='';$('#orders').innerHTML=`<p class="final">${rank[0].human?'Hai vinto!':'Vince '+rank[0].name}</p><p>${rank.map((p,i)=>`${i+1}. ${p.name}: ${money(p.pocket)} (${p.pocket} zucche)`).join('<br>')}</p>`;$('#resolve').disabled=true}else{const d=me.dice;$('#dice').innerHTML=d.map(x=>`<span class="die">${x}</span>`).join('');$('#orders').innerHTML=`<label>Dado Semina</label><select id="sow">${options(d,d[2])}</select><label>Dado Difesa</label><select id="defend">${options(d,d[1])}</select><label>Dado Attacco</label><select id="attackDie">${options(d,d[0])}</select><label>Investo la difesa in</label><select id="defense"><option value="fence">Recinto persistente</option><option value="scarecrow">Spaventapasseri persistente</option><option value="shotgun">Contadino con la Lupara (solo questo turno)</option></select><label>Attacco con</label><select id="attack"><option value="raccoons">Procioni - rubano di notte</option><option value="crows">Corvi - disperdono all'alba</option></select><label>Bersaglio</label><select id="target">${g.players.slice(1).map(p=>`<option value="${p.id}">${p.name} - campo ${p.field}</option>`).join('')}</select><div id="preview" style="margin:10px 0;padding:10px;background:#fff8;border-radius:10px"></div><div id="error" class="warning"></div>`;$('#resolve').disabled=false;['sow','defend','attackDie','defense','attack','target'].forEach(id=>$('#'+id).onchange=updatePreview);updatePreview()}
 $('#result').innerHTML=(g.last?renderLast(g.last):'<p><b>Il turno inizia.</b></p><p>Scegli dove mettere alto, medio e basso. Gli ordini degli altri saranno rivelati insieme ai tuoi.</p>')+'<div class="line">'+g.log.slice(0,8).join('</div><div class="line">')+'</div>'}
function updatePreview(){if(!$('#preview'))return;const t=g.players.find(p=>p.id===$('#target').value),kind=$('#attack').value,die=+$('#attackDie').value,structure=kind==='crows'?t.scarecrow:t.fence,solo=Math.max(0,die-structure),cap=g.final?t.field:Math.floor(t.field*(kind==='crows'?.75:.5)),effect=Math.min(solo,cap);$('#preview').innerHTML=`<b>La tua intenzione</b><br>Semini con ${$('#sow').value}. ${defense($('#defense').value)} con ${$('#defend').value}.<br>${animal(kind)} ${die} contro <b>${t.name}</b>: da solo potresti ${kind==='crows'?'disperdere':'rubare'} fino a <b>${effect} zucche</b>.<br><small>Gli attacchi simultanei e la Lupara del bersaglio possono cambiare l'esito.</small>`}
function renderLast(x){const mine=x.turnStats[g.players[0].id],crows=x.detail.filter(d=>d.type==='crows'),raccoons=x.detail.filter(d=>d.type==='raccoons'),scene=(title,list,verb)=>`<h3>${title}</h3>`+(list.length?list.map(d=>{const t=g.players.find(p=>p.id===d.target);return `<div class="line"><b>${d.list.length} ${animal(d.type)}</b> verso ${t.name}. Forza ${d.attack.toLocaleString('it-IT')}; ${d.structure} fermati dalla struttura e ${d.gun} dalla Lupara. <b>${d.effect} zucche ${verb}.</b><details><summary>Perché?</summary>${d.attack.toLocaleString('it-IT')} - ${d.structure} - ${d.gun} = ${d.surplus.toLocaleString('it-IT')} superiorità, con il tetto del campo.</details></div>`}).join(''):'<div class="line">Nessun attacco.</div>');const personal=`<div style="padding:10px;background:#fff8;border-radius:10px"><b>Il tuo turno</b><br>+${mine.sown} dalla Semina; +${mine.crowClaim+mine.redistributed} dai Corvi e dalla risemina; +${mine.raccoonLoot} rubate dai Procioni; -${mine.crowLost} disperse; -${mine.raccoonLost} rubate.<br>Difesa: ${defense(mine.built)} ${mine.builtValue?'+':''}${mine.builtValue}.</div>`;return `<h3>1. Semina</h3><div class="line">Il Cucuzzaro libera <b>${x.release} zucche</b>. Tu ne coltivi ${mine.sown}.</div>${scene('2. Alba - arrivano i Corvi',crows,'disperse')}${scene('3. Notte - arrivano i Procioni',raccoons,'rubate')}${x.market?`<h3>4. ${x.final?'Mercato finale':'Mercato'}</h3><div class="line">I campi vengono incassati e le strutture smontate.</div>`:''}${personal}`}
$('#resolve').onclick=()=>{try{const me=g.players[0];E.setOrder(g,me.id,{sow:+$('#sow').value,defend:+$('#defend').value,attackDie:+$('#attackDie').value,defense:$('#defense').value,attack:$('#attack').value,target:$('#target').value});E.resolve(g,rng);if(!g.finished)E.roll(g,rng);draw()}catch(e){$('#error').textContent=e.message}};$('#new').onclick=start;start();
</script><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script><script type="module" src="v2-field.js?v=5"></script></body></html>
